# Builds the GainzAlgo Pro Max Android release APK on GitHub's runners.
#
# Signing: set these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your release .jks / .keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Backend address baked in as the default (users can still change it in the app):
#   repository variable EXPO_PUBLIC_API_BASE_URL  e.g. https://api.your-domain.com  (HTTPS only)
#
# Without the signing secrets the APK is signed with a throw-away key generated
# for that run: it installs, but it cannot upgrade a release-signed install and
# is never attached to a GitHub Release.
name: android-apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    # every change to the app on main also produces an installable APK
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # ships the Android SDK, build-tools and JDK 17
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (pre-installed on the runner)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"
          test -d "$SDK/build-tools" || { echo "::error::no Android SDK on this runner"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls "$SDK/build-tools" | sort -V | tail -3

      - name: Install
        run: npm ci
        env:
          NODE_ENV: development

      - name: Type-check, lint and test
        env:
          NODE_ENV: test
        run: |
          npx tsc --noEmit
          npx eslint . --max-warnings 0
          npx jest --ci

      - name: Refuse an unencrypted production backend address
        run: |
          if [ -n "$EXPO_PUBLIC_API_BASE_URL" ] && [[ "$EXPO_PUBLIC_API_BASE_URL" != https://* ]]; then
            echo "::error::EXPO_PUBLIC_API_BASE_URL must start with https://"; exit 1
          fi
          if [ -z "$EXPO_PUBLIC_API_BASE_URL" ]; then
            echo "::warning::EXPO_PUBLIC_API_BASE_URL is not set: the app will ask for the backend address on first start."
          fi

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: mobile/android
        # phones are ARM; leaving out the x86 emulator ABIs keeps the APK small
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Show the build error
        if: failure()
        run: |
          # surface the cause as annotations (readable without downloading logs)
          for f in "$RUNNER_TEMP/gradle.log"; do
            [ -f "$f" ] || continue
            grep -E "FAILURE|What went wrong|error:|Error:|Exception|Could not" "$f" | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          done

      - name: Sign
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets: signing with a throw-away key (test install only)."
            KS_PASS="$(openssl rand -hex 16)"; KEY_PASS="$KS_PASS"; KEY_ALIAS=ci-test
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GainzAlgo CI test" >/dev/null
            echo "kind=test" >> "$GITHUB_OUTPUT"
          fi
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS --out GainzAlgo-Pro-Max.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs GainzAlgo-Pro-Max.apk | grep -v -i "password" || true
          rm -f "$KS"
          sha256sum GainzAlgo-Pro-Max.apk | tee GainzAlgo-Pro-Max.apk.sha256

      - name: Check the package holds no secrets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk" && unzip -q GainzAlgo-Pro-Max.apk -d "$RUNNER_TEMP/apk"
          # binary files (the Hermes bundle) included: scan their strings
          if find "$RUNNER_TEMP/apk" -type f -print0 | xargs -0 strings -n 6 \
             | grep -E "KITE_API_SECRET|KITE_ACCESS_TOKEN|CREDENTIALS_ENCRYPTION_KEY=|BEGIN (RSA |EC )?PRIVATE KEY"; then
            echo "::error::secret-looking material found in the APK"; exit 1
          fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2" dump permissions GainzAlgo-Pro-Max.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GainzAlgo-Pro-Max-${{ steps.sign.outputs.kind }}-${{ github.sha }}
          path: |
            mobile/GainzAlgo-Pro-Max.apk
            mobile/GainzAlgo-Pro-Max.apk.sha256
          retention-days: 30

      - name: Attach to the GitHub Release (tags only, release-signed only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.kind == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/GainzAlgo-Pro-Max.apk
            mobile/GainzAlgo-Pro-Max.apk.sha256
          body: |
            GainzAlgo Pro Max Android build ${{ github.ref_name }}.
            PAPER mode is the default. Live trading stays off unless enabled on the backend.
            Verify: `sha256sum -c GainzAlgo-Pro-Max.apk.sha256`.

      - name: Publish a test-signed pre-release (main or tags, no signing secrets)
        if: github.event_name == 'push' && steps.sign.outputs.kind == 'test'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-build.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-build.{0}', github.run_number) }} (test-signed)
          files: |
            mobile/GainzAlgo-Pro-Max.apk
            mobile/GainzAlgo-Pro-Max.apk.sha256
          body: |
            TEST-SIGNED build of GainzAlgo Pro Max (commit ${{ github.sha }}) — for installing and trying the app.
            It is signed with a throw-away key made for this build, so a later release-signed version cannot
            update it: uninstall this one first. For release builds add the ANDROID_KEYSTORE_* secrets.
            PAPER mode is the default. Live trading stays off unless enabled on the backend.
            Verify: `sha256sum -c GainzAlgo-Pro-Max.apk.sha256`.
